<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115">
<title>Saúde dos Nós</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #14161a; --muted: #5d6572; --line: #e2e5ea;
    --ok: #1a8f4c; --warn: #b7791f; --crit: #c53030; --off: #6b7280;
    --ok-bg: #e6f6ed; --warn-bg: #fdf3dc; --crit-bg: #fde8e8; --off-bg: #eceef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa3b0; --line: #2a2f38;
      --ok: #4ade80; --warn: #fbbf24; --crit: #f87171; --off: #9ca3af;
      --ok-bg: #12301f; --warn-bg: #3a2c0b; --crit-bg: #3b1616; --off-bg: #23272e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  header { padding: 20px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  .banner { border-radius: 12px; padding: 14px 16px; font-weight: 600; margin-bottom: 14px;
    display: flex; align-items: center; gap: 10px; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.crit { background: var(--crit-bg); color: var(--crit); }
  .banner.off { background: var(--off-bg); color: var(--off); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .grid { grid-template-columns: 1fr 1fr; } body { max-width: 980px; margin: 0 auto; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .card h2 { font-size: 16px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.crit { background: var(--crit-bg); color: var(--crit); }
  .pill.off { background: var(--off-bg); color: var(--off); }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .metric { margin: 12px 0; }
  .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .row b { font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 6px; background: var(--off-bg); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s; }
  .bar.warn > i { background: var(--warn); }
  .bar.crit > i { background: var(--crit); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .kv b { display: block; color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
  .err { margin-top: 10px; font-size: 13px; color: var(--crit); }
  .tools { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); min-height: 44px; }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Saúde dos Nós</h1>
  <span class="sub" id="atualizado">—</span>
</header>

<div id="geral" class="banner off"><span class="dot"></span><span id="geralTxt">Carregando…</span></div>

<div class="grid" id="nos"></div>

<div class="tools">
  <button id="btnAtualizar">Atualizar agora</button>
  <button id="btnNotif">Ativar notificações</button>
</div>
<footer>
  Atualiza a cada 30 s enquanto a página estiver aberta. Para ser avisado com a página fechada, use o monitor externo (UptimeRobot) apontando para o /health de cada nó.
</footer>

<script>
(function () {
  // ---- Configuração: um item por nó. Basta acrescentar uma linha para um novo nó. ----
  var NOS = [
    { nome: "Nó 1", url: "https://node233314-efiscal.sp1.br.saveincloud.net.br/health" },
    { nome: "Nó 2", url: "https://node233310-efiscal.sp1.br.saveincloud.net.br/health" }
  ];
  var INTERVALO_MS = 30000;
  var TIMEOUT_MS = 8000;
  var FALHAS_PARA_ALERTAR = 2; // evita alarme por uma única falha de rede

  var estado = NOS.map(function () { return { falhas: 0, ultimo: null, alertado: null }; });
  var elNos = document.getElementById("nos");

  NOS.forEach(function (n, i) {
    var c = document.createElement("section");
    c.className = "card"; c.id = "no" + i;
    c.innerHTML =
      '<h2><span>' + n.nome + '</span><span class="pill off" data-r="pill">…</span></h2>' +
      '<div class="meta" data-r="meta">Consultando…</div>' +
      '<div class="metric"><div class="row"><span>Metaspace</span><b data-r="metaTxt">—</b></div><div class="bar" data-r="metaBar"><i></i></div></div>' +
      '<div class="metric"><div class="row"><span>Heap</span><b data-r="heapTxt">—</b></div><div class="bar" data-r="heapBar"><i></i></div></div>' +
      '<div class="kv"><div>Banco<b data-r="db">—</b></div><div>No ar há<b data-r="up">—</b></div>' +
      '<div>Classes<b data-r="cls">—</b></div><div>Threads<b data-r="thr">—</b></div></div>' +
      '<div class="err" data-r="err" hidden></div>';
    elNos.appendChild(c);
  });

  function q(i, r) { return document.querySelector("#no" + i + " [data-r=" + r + "]"); }
  function fmtUp(ms) {
    var m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d > 0) return d + "d " + (h % 24) + "h";
    if (h > 0) return h + "h " + (m % 60) + "min";
    return m + "min";
  }
  function setBar(i, r, pct) {
    var b = q(i, r); b.className = "bar " + (pct >= 92 ? "crit" : pct >= 85 ? "warn" : "");
    b.firstChild.style.width = Math.min(100, pct) + "%";
  }
  function pill(i, cls, txt) { var p = q(i, "pill"); p.className = "pill " + cls; p.textContent = txt; }

  function comTimeout(url) {
    var ctrl = new AbortController();
    var t = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
    return fetch(url + "?t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
      .finally(function () { clearTimeout(t); });
  }

  // Retorna "ok" | "warn" | "crit" | "off" para o nó e atualiza o card.
  function consultar(i) {
    var n = NOS[i];
    return comTimeout(n.url).then(function (resp) {
      if (resp.status === 404) { throw new Error("/health ainda não está publicado neste nó"); }
      return resp.json().then(function (d) { return { d: d, http: resp.status }; });
    }).then(function (x) {
      var d = x.d; estado[i].falhas = 0; estado[i].ultimo = Date.now();
      var st = d.status === "ok" || d.status === "warn" || d.status === "crit" ? d.status : "crit";
      pill(i, st, st === "ok" ? "OK" : st === "warn" ? "Atenção" : "Crítico");
      q(i, "meta").textContent = "Respondeu em " + new Date().toLocaleTimeString("pt-BR");
      q(i, "metaTxt").textContent = d.metaspace.usedMb + " / " + d.metaspace.maxMb + " MB (" + d.metaspace.pct + "%)";
      q(i, "heapTxt").textContent = d.heap.usedMb + " / " + d.heap.maxMb + " MB (" + d.heap.pct + "%)";
      setBar(i, "metaBar", parseFloat(d.metaspace.pct)); setBar(i, "heapBar", parseFloat(d.heap.pct));
      q(i, "db").textContent = d.db.ok ? "OK (" + d.db.ms + " ms)" : "FORA";
      q(i, "up").textContent = fmtUp(d.uptimeMs);
      q(i, "cls").textContent = d.classes.toLocaleString("pt-BR");
      q(i, "thr").textContent = d.threads;
      var e = q(i, "err");
      if (st === "crit") { e.hidden = false; e.textContent = !d.db.ok ? "Banco de dados sem resposta." : "Memória acima do limite crítico."; }
      else if (st === "warn") { e.hidden = false; e.textContent = "Memória acima de 85% — acompanhe."; }
      else { e.hidden = true; }
      return st;
    }).catch(function (err) {
      estado[i].falhas++;
      var fora = estado[i].falhas >= FALHAS_PARA_ALERTAR;
      pill(i, fora ? "crit" : "off", fora ? "Fora do ar" : "Verificando");
      q(i, "meta").textContent = estado[i].ultimo ? "Última resposta às " + new Date(estado[i].ultimo).toLocaleTimeString("pt-BR") : "Sem resposta";
      var e = q(i, "err"); e.hidden = false;
      e.textContent = err.name === "AbortError" ? "Sem resposta em " + (TIMEOUT_MS / 1000) + " s." : (err.message || "Falha ao consultar.");
      return fora ? "crit" : "off";
    });
  }

  var PESO = { ok: 0, off: 1, warn: 2, crit: 3 };
  function alertar(i, st) {
    if (st === estado[i].alertado) return;
    estado[i].alertado = st;
    if (st !== "crit" && st !== "warn") return;
    var msg = NOS[i].nome + (st === "crit" ? " em estado CRÍTICO" : " precisa de atenção");
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("e-Fiscal — " + msg); } catch (e) { /* alguns celulares exigem service worker */ }
    }
  }

  function ciclo() {
    return Promise.all(NOS.map(function (_, i) { return consultar(i); })).then(function (res) {
      res.forEach(function (st, i) { alertar(i, st); });
      var pior = res.reduce(function (a, s) { return PESO[s] > PESO[a] ? s : a; }, "ok");
      var criticos = res.filter(function (s) { return s === "crit"; }).length;
      var g = document.getElementById("geral");
      var txt = { ok: "Todos os nós operando normalmente", warn: "Atenção: algum nó com uso de memória alto",
                  off: "Verificando nós…", crit: criticos === NOS.length ? "CRÍTICO: todos os nós com problema — sistema fora do ar"
                                                                       : "CRÍTICO: " + criticos + " de " + NOS.length + " nós com problema" };
      g.className = "banner " + pior;
      document.getElementById("geralTxt").textContent = txt[pior];
      document.title = (pior === "crit" ? "🔴 " : pior === "warn" ? "🟡 " : pior === "ok" ? "🟢 " : "") + "Saúde dos Nós";
      document.getElementById("atualizado").textContent = new Date().toLocaleTimeString("pt-BR");
    });
  }

  document.getElementById("btnAtualizar").onclick = ciclo;
  var bn = document.getElementById("btnNotif");
  if (!("Notification" in window)) { bn.hidden = true; }
  else {
    var rot = function () { bn.textContent = Notification.permission === "granted" ? "Notificações ativas" : "Ativar notificações"; };
    bn.onclick = function () { Notification.requestPermission().then(rot); }; rot();
  }

  ciclo(); setInterval(ciclo, INTERVALO_MS);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ciclo(); });
})();
</script>
</body>
</html>
